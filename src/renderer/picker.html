<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'" />
  <title>meu-bot · escolher máquina</title>
  <link rel="stylesheet" href="picker.css" />
</head>
<body>
  <header class="head">
    <h1>Abrir o meu-bot em…</h1>
    <p class="sub">Cada máquina é uma janela. ↑↓ escolhe · Enter abre · Esc fecha</p>
    <p id="pk-error" class="error" hidden></p>
  </header>
  <input id="pk-filter" type="search" placeholder="filtrar máquinas…" autocomplete="off" />
  <ul id="pk-list" class="list" role="listbox"></ul>
  <section id="pk-detail" class="detail" hidden>
    <p id="pk-status" class="status"></p>
    <div class="actions">
      <button type="button" id="pk-install" class="btn btn-ghost" hidden>Instalar backend</button>
      <button type="button" id="pk-relief-shortcut" class="btn btn-ghost" hidden>🧯 Botão de alívio na mesa</button>
      <button type="button" id="pk-tailscale" class="btn btn-ghost" hidden title="Abre um ssh paciente, leva o link de verificação ao navegador e espera você aprovar">Aprovar verificação do Tailscale</button>
      <button type="button" id="pk-grokbot-reset" class="btn btn-ghost btn-danger" hidden title="Pod congelado pelo host: só o reset pelo app do Grok Bot resolve. Abre o app no card certo; o reset é o seu clique lá.">Abrir o reset no app do Grok Bot</button>
    </div>
    <pre id="pk-log" class="log" hidden></pre>
  </section>
  <p id="pk-note" class="note" hidden></p>
  <footer class="foot">
    <span class="foot-caption">sincronizar ssh</span>
    <button type="button" id="pk-sync" class="shortcut" title="Acrescenta ao ~/.ssh/config deste Mac as máquinas do projeto que ainda faltam (o Cursor lê o mesmo arquivo)">⇅</button>
    <label class="foot-check" title="Marcado: a janela abre direto. Desmarcado: a abertura animada aparece toda vez."><input type="checkbox" id="pk-direct" /> abrir</label>
    <label class="foot-check" title="Marcado: o onboarding já foi feito. Desmarcado: a próxima janela abre com o onboarding guiado."><input type="checkbox" id="pk-onboarded" /> feito</label>
    <span class="spacer"></span>
    <button type="button" id="pk-cancel" class="btn btn-ghost">Cancelar</button>
    <button type="button" id="pk-open" class="btn btn-primary" disabled>Abrir</button>
  </footer>
  <script type="module" src="picker.js"></script>
</body>
</html>
