# API da conta meu-bot (conta.agentesgrok.com) e a página de login (auth.agentesgrok.com), um Worker só: a página são
# os static assets em public/ (servidos quando o host é o de auth), a API responde no host de conta. Dois ambientes:
# o padrão é produção; `--env staging` publica em conta-staging./auth-staging., com D1 próprio (o meu-bot-staging só
# fala com o staging, nunca com produção).
#
# Secrets (wrangler secret put, por ambiente): SESSAO_HMAC_KEY (32 bytes base64, assina os tokens de acesso),
# LICENCA_PRIVATE_KEY (privada Ed25519 da licença, PKCS#8 DER base64: scripts/chave-licenca.mjs --copiar).
# Vars (abaixo): projeto Firebase, origem da página e o e-mail do primeiro super admin.
name = "conta-api"
main = "src/index.ts"
compatibility_date = "2025-10-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[routes]]
pattern = "conta.agentesgrok.com"
custom_domain = true
[[routes]]
pattern = "auth.agentesgrok.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "conta"
database_id = "PREENCHER-NO-PRIMEIRO-DEPLOY"
migrations_dir = "migrations"

[vars]
CANAL = "producao"
AUTH_ORIGIN = "https://auth.agentesgrok.com"
API_ORIGIN = "https://conta.agentesgrok.com"
FIREBASE_PROJECT_ID = "meu-bot-conta"
FIREBASE_API_KEY = "AIzaSyD8rfzsg5iLBqegRmzfmVoBcE5d-sqruRw"
FIREBASE_AUTH_DOMAIN = "meu-bot-conta.firebaseapp.com"
ADMIN_BOOTSTRAP_EMAIL = "box@agentesgrok.com"

[env.staging]
name = "conta-api-staging"
workers_dev = false
[env.staging.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
[[env.staging.routes]]
pattern = "conta-staging.agentesgrok.com"
custom_domain = true
[[env.staging.routes]]
pattern = "auth-staging.agentesgrok.com"
custom_domain = true
[[env.staging.d1_databases]]
binding = "DB"
database_name = "conta-staging"
database_id = "PREENCHER-NO-PRIMEIRO-DEPLOY"
migrations_dir = "migrations"
[env.staging.vars]
CANAL = "staging"
AUTH_ORIGIN = "https://auth-staging.agentesgrok.com"
API_ORIGIN = "https://conta-staging.agentesgrok.com"
FIREBASE_PROJECT_ID = "meu-bot-conta"
FIREBASE_API_KEY = "AIzaSyD8rfzsg5iLBqegRmzfmVoBcE5d-sqruRw"
FIREBASE_AUTH_DOMAIN = "meu-bot-conta.firebaseapp.com"
ADMIN_BOOTSTRAP_EMAIL = "box@agentesgrok.com"
