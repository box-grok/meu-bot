# Roda os testes em todo PR e push na main, em Ubuntu (a fila de runners macOS do GitHub chegou a
# cancelar jobs por falta de máquina; a suíte não depende do Mac). Não usa segredos, então funciona
# também nos PRs que vêm de fork. Não trocar para pull_request_target.
name: Testes

on:
  pull_request:
  # O Claude dispara pelo gh workflow run: push feito com GITHUB_TOKEN não aciona pull_request.
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: testes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Histórico e tags: o release-checar compara com a última release (v*) e com a base do PR.
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      # O que faria a release automática recusar: componente da máquina mudou sem subir a versão.
      - run: node scripts/release-checar.mjs
