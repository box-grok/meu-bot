; Vigia do tailscaled: reinicia-o quando a VM acorda travada sem netmap (ver tailscale-watchdog.sh).
; Programa próprio, fora do [group:lvbox]: um supervisorctl update aqui não reinicia o gateway.
[program:tailscale-watchdog]
command=/bin/bash /home/box/openclaw-mythos/deploy/sv/tailscale-watchdog.sh
directory=/home/box
user=box
environment=HOME="/home/box",USER="box"
autostart=true
autorestart=true
startsecs=5
stdout_logfile=/home/box/openclaw-mythos/logs/sv/tailscale-watchdog.log
stderr_logfile=/home/box/openclaw-mythos/logs/sv/tailscale-watchdog.log
