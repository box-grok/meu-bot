# Máquinas do meu-bot, no formato do ~/.ssh/config.
#
# O botão "sincronizar ssh" do seletor copia para o ~/.ssh/config do Mac os blocos daqui que ainda
# não existem lá (nunca altera um Host que já existe). O Cursor (Remote SSH) lê o mesmo arquivo, então
# as máquinas aparecem nos dois ao mesmo tempo. Num Mac novo: clonar o projeto, abrir o app e clicar.
#
# Não há segredo aqui: a chave privada (~/.ssh/id_ed25519) não é versionada e precisa estar no Mac,
# com a pública em ~/.ssh/authorized_keys de cada máquina (docs/PLAYBOOK-nova-maquina.md, seção 1).

# VM do Colima (Lima) do próprio Mac; se não houver Colima, o ssh ignora o arquivo ausente.
Include ~/.colima/ssh_config

# Computador do Grok Bot (pod): só pela rede Tailscale, porta 22 = Tailscale SSH.
Host grokbot-1
    HostName 100.69.163.93
    User box
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ServerAliveInterval 60
    ServerAliveCountMax 3

# VM própria (Debian 13), usuário comum: é a que roda bypass.
Host agente-box
    HostName 187.127.41.175
    User box
    Port 22
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ServerAliveInterval 60
    ServerAliveCountMax 3

# Mesma VM como root, só para administração (root não roda bypass).
Host agente-root
    HostName 187.127.41.175
    User root
    Port 22
    IdentityFile ~/.ssh/id_ed25519
    IdentitiesOnly yes
    ServerAliveInterval 60
    ServerAliveCountMax 3
