<svg xmlns="http://www.w3.org/2000/svg" width="660" height="400" viewBox="0 0 660 400">
  <!-- Fundo do instalador .dmg (janela 660×400). O Finder desenha os ícones por cima: o app em (165,190) e
       Aplicativos em (495,190). Os cartões brancos ficam atrás deles para o nome sob o ícone ser legível. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1322"/>
      <stop offset="1" stop-color="#18264a"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7aa2ff"/>
      <stop offset="1" stop-color="#2f6fed"/>
    </linearGradient>
    <!-- A bolha-mascote do app (mesmo desenho do #intro-mascot-tpl), em escala 64. -->
    <g id="m">
      <path d="M12 8h40a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H30l-11 10V50h-7a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z"/>
    </g>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect width="660" height="400" fill="url(#bg)"/>

  <!-- Bolhas grandes e apagadas ao fundo, na cor da marca. -->
  <g fill="#7aa2ff" opacity=".07">
    <use href="#m" transform="translate(470 -70) scale(4.2)"/>
    <use href="#m" transform="translate(-60 250) scale(3)"/>
  </g>

  <!-- Marca no canto: bolha com olhos + "meu-bot". -->
  <g transform="translate(34 30) scale(.62)">
    <path d="M12 8h40a8 8 0 0 1 8 8v26a8 8 0 0 1-8 8H30l-11 10V50h-7a8 8 0 0 1-8-8V16a8 8 0 0 1 8-8z" fill="url(#bubble)"/>
    <circle cx="24" cy="27" r="4" fill="#0d1322"/><circle cx="40" cy="27" r="4" fill="#0d1322"/>
    <rect x="26" y="37" width="12" height="3.5" rx="1.75" fill="#0d1322"/>
  </g>
  <text x="80" y="58" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', sans-serif" font-size="27" font-weight="700" fill="#ffffff" letter-spacing="-.5">meu-bot</text>

  <!-- Cartões atrás dos ícones. -->
  <g filter="url(#soft)" fill="#ffffff">
    <rect x="75" y="100" width="180" height="180" rx="22"/>
    <rect x="405" y="100" width="180" height="180" rx="22"/>
  </g>

  <!-- Seta e instrução. -->
  <path d="M312 170 l20 20 -20 20" fill="none" stroke="#ffffff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="330" y="246" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="15" font-weight="600" fill="#ffffff">arraste</text>
  <text x="330" y="266" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="13" fill="#9db7ff">para instalar</text>

  <text x="330" y="360" text-anchor="middle" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', sans-serif" font-size="12" fill="#8a98bd">Arraste o meu-bot para a pasta Aplicativos e abra por lá.</text>
</svg>
